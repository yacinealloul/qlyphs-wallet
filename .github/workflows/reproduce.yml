# Rebuilds the keys.qlyphs.com release from this commit in a clean runner and prints its release hash.
# On a keys-v* tag it also checks the live site serves exactly that build.
name: Reproduce keys release
on:
  push:
    branches: [main]
    tags: ['keys-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the release files (deploy/keys.Dockerfile, target release)
        run: docker build -f deploy/keys.Dockerfile --target release --output type=local,dest=keys-release .
      - name: Release hash
        run: |
          cat keys-release/SHA256SUMS.txt
          echo "Release hash: $(sha256sum keys-release/SHA256SUMS.txt | cut -c1-64)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Live site serves this build
        if: startsWith(github.ref, 'refs/tags/keys-v')
        run: node apps/keys/verify.mjs https://keys.qlyphs.com --local keys-release
      - uses: actions/upload-artifact@v4
        with:
          name: keys-release
          path: keys-release/SHA256SUMS.txt
